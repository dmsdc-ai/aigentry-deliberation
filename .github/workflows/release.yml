name: Release

# HOW THIS PUBLISHES — npm TRUSTED PUBLISHING (OIDC). No npm token takes part in a release any
# more. The `publish` job alone holds the `id-token` permission (it appears once in this file, in
# that job); npm exchanges the GitHub OIDC token it enables for its own short-lived publish
# credential. Three absences in that job are load-bearing and must stay absent: no token in the
# step environment (GitHub injects only the secrets a workflow names, and this file names none),
# no npmrc from `setup-node`, which is used there without `registry-url`, and no user npmrc — the
# publish command points `npm_config_userconfig` at an empty file. With no credential reachable, a
# failed OIDC exchange FAILS the publish instead of silently succeeding some other way, which is
# the only reason a green run here can be read as "OIDC worked".
#
# The `test` job below keeps its `registry-url` deliberately: it never publishes, and the npmrc
# setup-node writes there carries an unset NODE_AUTH_TOKEN, so it has no effect.
#
# WHY THE PUBLISH JOB SETS NODE UP TWICE. `prepublishOnly` (`vitest run`) used to run as a side
# effect of publishing the working directory, on the publish job's Node — this repository's last
# gate before anything reaches the registry. Trusted publishing needs npm >= 11.5.1, which Node 20
# does not ship, and ci.yml's matrix (node 18, 20, 22) does not certify Node 24. So that suite runs
# EXPLICITLY on Node 20, as its own step, and the second setup-node raises Node to 24 for the OIDC
# exchange and the upload alone. The publish then runs with `--ignore-scripts` so the hook does not
# run a second time on the uncertified Node. Do not delete the explicit step: it IS the
# `prepublishOnly` gate, and with `--ignore-scripts` nothing else would run it.
#
# THE NPM-SIDE REGISTRATION THIS FILE DEPENDS ON. npmjs.com -> @dmsdc-ai/aigentry-deliberation ->
# Settings -> Trusted publishing -> GitHub Actions. All fields are case-sensitive and exact, and
# npm does not validate them when they are saved — a wrong field surfaces only as a failed
# publish:
#   organization or user   dmsdc-ai
#   repository             aigentry-deliberation
#   workflow filename      release.yml   (the filename only, never a path, and never this file's
#                                        `name:` above, which is `Release`)
#   environment name       empty — no job here uses a GitHub environment
#   allowed actions        `npm publish` must be ALLOWED explicitly. A configuration created
#                          after 2026-09-03 defaults to stage publish only, and the publish step
#                          below runs `npm publish`, so the default would fail the release.
# CREATE IT ON THE DAY OF THE RELEASE: a new configuration expires unless a publish succeeds
# within 2 days, and it cannot be edited afterwards — a wrong field is fixed by deleting and
# recreating it, which restarts that 2-day clock.
#
# THE FIRST OIDC PUBLISH MUST BE CHECKED BY HAND. This workflow has no registry read-back, so a
# green run is not by itself evidence that npm serves this version. After the first OIDC release,
# read it back:
#   npm view @dmsdc-ai/aigentry-deliberation@<version> dist.shasum
#
# ROLLBACK, if an OIDC publish cannot be made to work: `git revert` the commit that moved this
# file to trusted publishing, which puts the publish job's `registry-url` and the publish step's
# token environment back. The repository secret NPM_TOKEN is deliberately LEFT IN PLACE until a
# first OIDC publish has been verified; nothing in this file references it, and GitHub injects
# only referenced secrets, so it cannot be the thing that made a run pass. Delete it only after
# the proof. There is no `workflow_dispatch` here, so a rejected publish cannot be retried at the
# same tag — npm versions are immutable, so recovery costs a patch version and a new tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the README sync step below pushes to main
      id-token: write  # npm trusted publishing (OIDC); the only job in this file that holds it
    steps:
      - uses: actions/checkout@v4
      # NO `registry-url` HERE, deliberately: with it, setup-node writes a
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` line into this job's npmrc, which is
      # precisely the mechanism that would let a stored token publish this package again. The
      # publish target is unchanged either way — package.json declares
      # `publishConfig.registry: "https://registry.npmjs.org/"`.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # Regenerate README from template + ecosystem.json so the published tarball
      # carries a fresh README. Fail-open: a cosmetic regen must NEVER abort a publish.
      - name: Regenerate README (pre-publish)
        run: node scripts/gen-readme.mjs
        continue-on-error: true
      # What the `prepublishOnly` hook did (`vitest run`, which is what `npm test` runs), now an
      # explicit step and still on a Node ci.yml certifies, because the publish below runs with
      # `--ignore-scripts`. This is this repository's last pre-publish gate.
      - name: Test (formerly the prepublishOnly hook)
        run: npm test
      # Node 24, and only from here on: trusted publishing needs npm >= 11.5.1, which the step
      # below measures rather than assumes. Nothing is built, tested or packed on this Node — it
      # is used for the OIDC exchange and the upload alone.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: The publishing toolchain must be able to do OIDC (npm >= 11.5.1)
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e '
            const measured = process.argv[1];
            const [major, minor, patch] = measured.split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error("::error::npm " + measured + " is below 11.5.1, the floor npm trusted publishing requires. This job cannot exchange an OIDC token for a publish credential, so it refuses here rather than at npm publish. Raise this job node-version until npm reports >= 11.5.1.");
              process.exit(1);
            }
            console.log("npm " + measured + " >= 11.5.1: this toolchain can publish through OIDC");' "$(npm --version)"
      # Trusted publishing and nothing else. This step declares no credential environment; the
      # setup-node above wrote no `_authToken` npmrc because it has no `registry-url`; and the
      # command runs with `npm_config_userconfig` pointed at a file it creates empty, so no user-
      # or global-level npmrc can supply auth either. `--ignore-scripts` keeps `prepublishOnly`
      # from running a second time on Node 24 — the explicit step above already ran it.
      - run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/empty-npmrc"
          npm_config_userconfig="${RUNNER_TEMP}/empty-npmrc" \
            npm publish --access public --ignore-scripts
      # Sync the regenerated README back to main via github-actions[bot] (GITHUB_TOKEN
      # pushes don't retrigger workflows; [skip ci] + no-op guard are belt-and-suspenders).
      - name: Sync regenerated README to main
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          node scripts/gen-readme.mjs
          if git diff --quiet -- README.md; then echo "README already current"; exit 0; fi
          git add README.md
          git commit -m "docs: regen README [skip ci]"
          git push origin HEAD:main

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
